# Tengine/Nginx：文档站缓存。各版本目录（/3.x/doc/、/3.4/doc/ 等）都套同一规则。
# HTML 不缓存（或每次回源校验），避免发版后仍用旧 HTML 去请求已换哈希的 CSS。
# _astro 带内容哈希，可长期缓存。
# 隐私策略应使用专用响应头。部署层必须删除错误的
# `Content-Security-Policy: referrer=no-referrer`（等号写法不是合法 CSP directive）。
add_header Referrer-Policy "no-referrer" always;

location ~* /doc/.*\.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Referrer-Policy "no-referrer" always;
}

location ~* /doc/_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Referrer-Policy "no-referrer" always;
}
