# Tengine/Nginx：文档站缓存。把 location 并进 /3.x/doc/ 对应站点配置。
# HTML 不缓存（或每次回源校验），避免发版后仍用旧 HTML 去请求已换哈希的 CSS。
# _astro 带内容哈希，可长期缓存。

location ~* ^/3\.x/doc/.*\.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

location ^~ /3.x/doc/_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
