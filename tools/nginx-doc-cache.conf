# Tengine/Nginx：文档站缓存。各版本目录（/3.x/doc/、/3.4/doc/ 等）都套同一规则。
# HTML 不缓存（或每次回源校验），避免发版后仍用旧 HTML 去请求已换哈希的 CSS。
# _astro 带内容哈希，可长期缓存。

location ~* /doc/.*\.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

location ~* /doc/_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
