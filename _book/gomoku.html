<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: #f0d9b5; font-family: "Microsoft YaHei", sans-serif;
  }
  h1 { margin-bottom: 12px; color: #5d4037; font-size: 28px; }
  #info {
    margin-bottom: 10px; font-size: 20px; color: #4e342e; height: 30px; line-height: 30px;
  }
  canvas { cursor: pointer; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  #restart {
    margin-top: 14px; padding: 10px 32px; font-size: 18px; border: none; border-radius: 6px;
    background: #5d4037; color: #fff; cursor: pointer; transition: background 0.2s;
  }
  #restart:hover { background: #795548; }
</style>
</head>
<body>
<h1>五子棋</h1>
<div id="info">黑棋落子</div>
<canvas id="board"></canvas>
<button id="restart">重新开始</button>
<script>
const SIZE = 15;
const CELL = 40;
const PAD = 30;
const CANVAS = CELL * (SIZE - 1) + PAD * 2;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
canvas.width = canvas.height = CANVAS;

let grid, current, gameOver, history;

function init() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  current = 1; // 1=黑, 2=白
  gameOver = false;
  history = [];
  info.textContent = '黑棋落子';
  draw();
}

function draw() {
  // 棋盘背景
  ctx.fillStyle = '#dcb468';
  ctx.fillRect(0, 0, CANVAS, CANVAS);

  // 网格线
  ctx.strokeStyle = '#6d4c21';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const p = PAD + i * CELL;
    ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(CANVAS - PAD, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, CANVAS - PAD); ctx.stroke();
  }

  // 星位
  const stars = [3, 7, 11];
  ctx.fillStyle = '#6d4c21';
  for (const r of stars) for (const c of stars) {
    ctx.beginPath();
    ctx.arc(PAD + c * CELL, PAD + r * CELL, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 棋子
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (!grid[r][c]) continue;
    const x = PAD + c * CELL, y = PAD + r * CELL;
    const isBlack = grid[r][c] === 1;
    const grad = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, 16);
    if (isBlack) {
      grad.addColorStop(0, '#555');
      grad.addColorStop(1, '#000');
    } else {
      grad.addColorStop(0, '#fff');
      grad.addColorStop(1, '#ccc');
    }
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = isBlack ? '#000' : '#aaa';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // 最后一手标记
  if (history.length > 0) {
    const last = history[history.length - 1];
    const lx = PAD + last.c * CELL, ly = PAD + last.r * CELL;
    ctx.fillStyle = grid[last.r][last.c] === 1 ? '#e53935' : '#e53935';
    ctx.beginPath();
    ctx.arc(lx, ly, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function checkWin(r, c) {
  const p = grid[r][c];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let d = 1; d < 5; d++) {
      const nr = r + dr * d, nc = c + dc * d;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || grid[nr][nc] !== p) break;
      count++;
    }
    for (let d = 1; d < 5; d++) {
      const nr = r - dr * d, nc = c - dc * d;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || grid[nr][nc] !== p) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

canvas.addEventListener('click', (e) => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const c = Math.round((mx - PAD) / CELL);
  const r = Math.round((my - PAD) / CELL);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || grid[r][c]) return;

  grid[r][c] = current;
  history.push({ r, c });
  draw();

  if (checkWin(r, c)) {
    gameOver = true;
    info.textContent = (current === 1 ? '黑棋' : '白棋') + '获胜！';
    return;
  }
  if (history.length === SIZE * SIZE) {
    gameOver = true;
    info.textContent = '平局！';
    return;
  }
  current = current === 1 ? 2 : 1;
  info.textContent = (current === 1 ? '黑棋' : '白棋') + '落子';
});

document.getElementById('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
